spring.application.name=farmdairy

spring.datasource.url=jdbc:postgresql://localhost:5432/farmdairy_db
spring.datasource.username=farmdairy_user
spring.datasource.password=${FARMDAIRY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=${FARMDAIRY_JWT_SECRET}
app.jwt.issuer=farmdairy-api
app.jwt.expiration-seconds=3600